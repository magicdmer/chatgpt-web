name: Manual Docker Build Test

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docker-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: chatgpt-web:manual-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          docker run --detach --name chatgpt-web-manual-test --publish 3002:3002 chatgpt-web:manual-test

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3002/ >/dev/null; then
              docker logs chatgpt-web-manual-test
              docker rm --force chatgpt-web-manual-test
              exit 0
            fi
            sleep 2
          done

          docker logs chatgpt-web-manual-test
          docker rm --force chatgpt-web-manual-test
          exit 1
